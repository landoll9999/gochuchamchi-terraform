# =============================================================================
# Terraform PR 검증 CI  (2026-08-04)
#
# 범위 — "클러스터/AWS 접속이 필요 없는 검증"까지만.
#   plan/apply는 여기 없다: 이 스택은 kubernetes/helm 프로바이더를 쓰고 EKS 퍼블릭
#   엔드포인트가 /32 허용목록으로 잠겨 있어, GitHub 호스티드 러너에서는 plan의
#   refresh 단계가 타임아웃 난다. plan/apply 자동화는 배스천 self-hosted runner
#   결정 후 별도 잡으로 추가한다 (docs/CICD_SETUP.md §러너 참고).
#   -> 그 전까지 apply는 로컬에서, 대신 "머지되는 코드는 항상 fmt/validate/lint/
#      보안스캔을 통과한 상태"를 CI가 보장한다.
#
# AWS 자격증명이 전혀 없다 — validate는 -backend=false로 state 접근 없이 돌고,
# tflint/checkov는 정적 분석이다. 그래서 이 워크플로는 permissions가 읽기뿐이다.
# =============================================================================
name: terraform-ci

on:
  pull_request:
    paths:
      - "go/terraform/**"
      - "go/cloudwatch-notifications/**"
      - "go/discord-notifications/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "go/terraform/**"
      - "go/cloudwatch-notifications/**"
      - "go/discord-notifications/**"

# 같은 PR에 커밋을 연달아 푸시하면 이전 실행은 취소 (러너 시간 절약)
concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - go/terraform
          - go/cloudwatch-notifications
    defaults:
      run:
        working-directory: ${{ matrix.stack }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # backend.tf가 요구하는 1.10+ (S3 use_lockfile)와 로컬 버전에 맞춤
          terraform_version: "~1.10"

      # 1) 포맷 — 어긋나면 실패. 로컬에서 terraform fmt -recursive 후 다시 푸시
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # 2) init/validate — -backend=false라 tfstate(S3)·AWS 자격증명이 필요 없다.
      #    프로바이더/모듈 다운로드만 하므로 호스티드 러너에서 안전하게 동작.
      - name: terraform init (backend 없이)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  lint:
    name: tflint (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - go/terraform
          - go/cloudwatch-notifications

    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      # aws 룰셋 플러그인까지 받아서 실행 (deprecated 문법, 미사용 선언,
      # 잘못된 인스턴스 타입 문자열 등 validate가 못 잡는 것들)
      # ※ 설정 파일은 검사 대상 디렉터리에 있어야 --chdir이 인식한다
      - name: tflint init
        working-directory: ${{ matrix.stack }}
        run: |
          cat > .tflint.hcl <<'EOF'
          plugin "aws" {
            enabled = true
            version = "0.38.0" # 동작 확인 후 최신으로 올릴 것
            source  = "github.com/terraform-linters/tflint-ruleset-aws"
          }
          EOF
          tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }} # 플러그인 다운로드 rate limit 회피

      - name: tflint
        working-directory: ${{ matrix.stack }}
        run: tflint --format=compact

  security-scan:
    name: checkov 보안 스캔
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # soft_fail: true — 처음 도입 시점에는 "보고"만 한다.
      #   이 저장소에는 의도적 절충이 여럿 있다(S3 이미지 버킷 퍼블릭 read,
      #   EKS 퍼블릭 엔드포인트+/32, SNS 토픽 미암호화 등 — 전부 코드 주석과
      #   SECURITY_AUDIT_REPORT에 사유 문서화됨). 이것들이 checkov에 걸리는데
      #   처음부터 hard fail로 두면 CI가 "늘 빨간" 상태가 되어 아무도 안 보게 된다.
      #   운영 전환 시: 결과를 훑어 정당한 항목을 skip-check 목록으로 옮긴 뒤
      #   soft_fail을 false로 바꿔서 "새로 유입되는 위반"만 막는 게 목표 상태.
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: go
          framework: terraform
          soft_fail: true
          output_format: cli
          quiet: true # PASSED는 생략하고 FAILED만 출력
