# ArgoCD 저장소 자격증명 — 구 kubernetes_secret_v1.gitops_repo_creds(argocd.tf)를
# 대체. Secrets Manager의 PAT를 ESO가 동기화하므로 tfstate에 PAT가 안 남는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gochuchamchi-gitops-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h # 로테이션 반영 주기. 즉시 반영하려면 이 CR을 kubectl로 재생성
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: gochuchamchi-gitops-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # ArgoCD가 이 라벨을 보고 저장소 자격증명으로 자동 인식 (기존과 동일)
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: "{{ .Values.repoURL }}"
        username: "{{ .Values.username }}"
        # 바깥쪽 중괄호는 helm이, 안쪽 .pat 참조는 ESO 템플릿 엔진이 해석하므로
        # helm 단계에서는 리터럴로 살려서 넘겨야 함 (backtick escape)
        # ※ 이 주석에 중괄호를 쓰면 안 된다 — helm은 주석도 템플릿으로 먼저 파싱해서
        #   빈 중괄호 한 쌍이 "missing value for command" parse error를 낸다
        password: "{{ `{{ .pat }}` }}"
  data:
    - secretKey: pat
      remoteRef:
        key: "{{ .Values.readPatSecretName }}"
