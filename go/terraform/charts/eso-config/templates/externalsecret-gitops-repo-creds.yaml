# ArgoCD 저장소 자격증명 — GitHub App 인증 (2026-08-18, read PAT 대체).
# ArgoCD는 시크릿에 githubAppID가 있으면 App 인증으로 동작한다 — 개인키로 1시간짜리
# 설치 토큰을 그때그때 자동 발급하므로 만료 갱신이 없다. Secrets Manager에는 개인키만
# 있고, App ID/Installation ID는 비밀이 아니라 helm 값으로 그대로 박는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gochuchamchi-gitops-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h # 키 로테이션 반영 주기. 즉시 반영하려면 이 CR을 kubectl로 재생성
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: gochuchamchi-gitops-repo-creds
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # ArgoCD가 이 라벨을 보고 저장소 자격증명으로 자동 인식 (기존과 동일)
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: "{{ .Values.repoURL }}"
        githubAppID: "{{ .Values.readApp.appID }}"
        githubAppInstallationID: "{{ .Values.readApp.installationID }}"
        # 바깥쪽 중괄호는 helm이, 안쪽 .privateKey 참조는 ESO 템플릿 엔진이 해석하므로
        # helm 단계에서는 리터럴로 살려서 넘겨야 함 (backtick escape)
        # ※ 이 주석에 중괄호를 쓰면 안 된다 — helm은 주석도 템플릿으로 먼저 파싱해서
        #   빈 중괄호 한 쌍이 "missing value for command" parse error를 낸다
        githubAppPrivateKey: "{{ `{{ .privateKey }}` }}"
  data:
    - secretKey: privateKey
      remoteRef:
        key: "{{ .Values.readAppKeySecretName }}"
