# Image Updater write-back 자격증명 — GitHub App 인증 (2026-08-18, write PAT 대체).
# application.yaml의 write-back-method(git:secret:)가 가리키는 시크릿이다.
# Image Updater도 시크릿에 githubAppID가 있으면 App 인증으로 판별한다(없으면
# username/password HTTPS로 폴백하는 구현 — 필드명은 ArgoCD 본체와 동일).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gochuchamchi-image-updater-git-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: gochuchamchi-image-updater-git-creds
    creationPolicy: Owner
    template:
      data:
        githubAppID: "{{ .Values.updaterApp.appID }}"
        githubAppInstallationID: "{{ .Values.updaterApp.installationID }}"
        githubAppPrivateKey: "{{ `{{ .privateKey }}` }}"
  data:
    - secretKey: privateKey
      remoteRef:
        key: "{{ .Values.updaterAppKeySecretName }}"
